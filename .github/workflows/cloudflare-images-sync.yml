name: Cloudflare Images Sync

on:
  push:
    branches:
      - main
    paths:
      - 'public/images/**'
      - 'scripts/cloudflare-images-sync.mjs'
      - '.github/workflows/cloudflare-images-sync.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upload git-backed images to Cloudflare Images
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_IMAGES_TOKEN: ${{ secrets.CF_IMAGES_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ACCOUNT_ID" ] || [ -z "${CF_IMAGES_TOKEN}${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::Cloudflare Images secrets CF_ACCOUNT_ID and CF_IMAGES_TOKEN are empty. Git /images backup stays live on Vercel until those GitHub secrets exist."
          fi
          node scripts/cloudflare-images-sync.mjs
